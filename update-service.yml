---
- name: Update and Restart Service
  hosts: home_server
  become: yes
  vars:
    # Reuse your vars from the main playbook
    remote_user: vince
    repo_name: calendar_alert_bot
    repo_url: "https://{{ github_pat }}@github.com/Vince-94/{{ repo_name }}.git"   # Replace with your GitHub repo URL
    repo_dest: "/home/{{ remote_user }}/{{ remote_user }}"
    requirements_path: "{{ repo_dest }}/requirements.txt"
    use_venv: false
    venv_path: "{{ repo_dest }}/venv"
    systemd_service_name: "{{ remote_user }}"

  tasks:
    - name: Pull latest changes from GitHub repo
      git:
        repo: "{{ repo_url }}"  # Assume this is defined in inventory/group_vars or passed via --extra-vars
        dest: "{{ repo_dest }}"
        version: main
        update: yes  # This pulls changes if available
        force: yes   # Optional: Overwrite local changes if conflicts (use cautiously)
      become_user: "{{ remote_user }}"
      register: git_pull_result  # Track if changes were made

    - name: Install Python dependencies from requirements.txt
      pip:
        requirements: "{{ requirements_path }}"
        virtualenv: "{{ venv_path if use_venv else omit }}"
        virtualenv_command: "{{ 'python3 -m venv' if use_venv else omit }}"
      become_user: "{{ remote_user }}"
      when: git_pull_result.changed  # Only run if git pulled changes

    - name: Restart service if updates applied
      systemd:
        name: "{{ systemd_service_name }}"
        state: restarted
        daemon_reload: yes  # Reload if service file might have changed (rare for updates)
      when: git_pull_result.changed  # Only restart if needed

    # Optional: Add a handler for more complex restarts
    # handlers:
    #   - name: Restart calendar_alert_bot
    #     systemd:
    #       name: "{{ systemd_service_name }}"
    #       state: restarted
