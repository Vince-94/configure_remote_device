---
- name: Stop calendar_alert_bot service
  hosts: home_server
  become: yes

  vars:
    systemd_service_name: "calendar_alert_bot"

  tasks:
    - name: Stop the service (if running)
      ansible.builtin.systemd_service:
        name:    "{{ systemd_service_name }}"
        state:   stopped
        enabled: no
      register: stop_result

    - name: Show what happened
      ansible.builtin.debug:
        msg: |
          Service       : {{ systemd_service_name }}
          Previous state: {{ stop_result.before.ActiveState | default('unknown') }}
          Action taken  : {{ 'stopped' if stop_result.changed else 'already stopped' }}
          Current state : {{ stop_result.after.ActiveState | default('unknown') }}
      when: stop_result is defined

    # Show last few lines only if something looks wrong
    - name: Show recent logs (only if stop failed or service is still active)
      ansible.builtin.command: journalctl -u {{ systemd_service_name }} -n 12 --no-pager --priority=warning..err
      register: logs
      changed_when: false
      failed_when: false
      when: stop_result is failed or (stop_result.after is defined and stop_result.after.ActiveState != 'inactive')

    - name: Display recent error/warning logs (if any)
      ansible.builtin.debug:
        msg: "{{ logs.stdout_lines | default(['No recent errors/warnings or journalctl failed']) }}"
      when: logs.stdout_lines is defined and logs.stdout_lines | length > 0
